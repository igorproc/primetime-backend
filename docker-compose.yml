version: '3.8'

services:
  redis:
    container_name: primetime-backend-redis-${ENVIRONMENT_NAME}
    image: redis:alpine
    restart: on-failure
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_BIND=0.0.0.0
      - REDIS_MAXMEMORY=1gb
      - REDIS_LOGLEVEL=notice
    volumes:
      - ./redis_data:/data
    ports:
      - "${REDIS_PORT}:6379"
    env_file:
      - .env
    networks:
      - app

  mysql:
    container_name: primetime-backend-mysql-${ENVIRONMENT_NAME}
    image: mysql:latest
    ports:
      - "3306:${MYSQL_PORT}"
    env_file:
      - ./Docker/environments/.db.env
    volumes:
      - ./data/database:/var/lib/mysql
    healthcheck:
      test: mysqladmin ping -h 0.0.0.0 -u root --password=$$MYSQL_ROOT_PASSWORD
      timeout: 10s
      retries: 10
    networks:
      - app

  app:
    container_name: primetime-backend-${ENVIRONMENT_NAME}
    build:
      context: .
      args:
        - ENVIRONMENT_NAME=${ENVIRONMENT_NAME}
        - BRANCH_NAME=${BRANCH_NAME}
      dockerfile: Docker/Dockerfile
    ports:
      - "3100:${APP_PORT}"
    environment:
      - ENVIRONMENT_NAME=${ENVIRONMENT_NAME}
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - app

  nginx:
    container_name: primetime-backend-nginx-${ENVIRONMENT_NAME}
    image: nginx:alpine
    restart: on-failure
    ports:
      - "${PORT}:80"
    depends_on:
      - app
    volumes:
      - ./Docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/nginx-data:/var/log/nginx
    networks:
      - app
      - nginx

networks:
  app:
    driver: bridge
    internal: true
  nginx:
    name: nginx-proxy
    external: true
